
media:
  input: public/uploads
  output: /uploads
  rename: safe

content:
  - name: sertifikalar
    label: Sertifikalar
    type: collection
    path: src/data/sertifikalar
    format: json
    filename: "{primary}.json"
    fields:
      - name: ad
        label: Sertifika Adı
        type: string
        required: true

      - name: kurum
        label: Eğitimi Veren Kurum
        type: string

      - name: yil
        label: Eğitim Yılı
        type: string

      - name: sure
        label: Eğitim Süresi
        type: string

      - name: aciklama
        label: Açıklama
        type: text

      - name: gorsel
        label: Sertifika Görseli
        type: image

      - name: belge
        label: PDF Belgesi
        type: file
        options:
          categories: [document]

    view:
      primary: ad
      fields: [ad, kurum, yil]



  - name: gorusme_metinleri
    label: Görüşme Metinleri
    type: file
    path: src/data/gorusmeler.json
    format: json
    fields:
      - name: genelAciklama
        label: Bölüm Açıklaması
        type: text
        required: true

      - name: yuzYuzeAciklama
        label: Yüz Yüze Terapi Açıklaması
        type: text
        required: true

      - name: onlineAciklama
        label: Online Terapi Açıklaması
        type: text
        required: true



  - name: anasayfa
    label: Ana Sayfa İçerikleri
    type: file
    path: src/data/anasayfa.json
    format: json
    fields:
      - name: anaBaslik
        label: Ana Başlık
        type: string
        required: true

      - name: anaAciklama
        label: Ana Açıklama
        type: text

      - name: hakkimdaBaslik
        label: Hakkımda Başlığı
        type: string

      - name: hakkimdaAciklama
        label: Hakkımda Açıklaması
        type: text

      - name: iletisimBaslik
        label: İletişim Başlığı
        type: string

      - name: iletisimAciklama
        label: İletişim Açıklaması
        type: text


        
  - name: hakkimda_icerikleri
    label: Hakkımda İçerikleri
    type: file
    path: src/data/hakkimda.json
    format: json
    operations:
      delete: false
    fields:
      - name: sayfaBasligi
        label: Sayfa Başlığı
        type: string

      - name: sayfaAciklamasi
        label: Sayfa Alt Açıklaması
        type: string

      - name: tanitimBasligi
        label: Tanıtım Başlığı
        type: string

      - name: paragraf1
        label: Akademik Özgeçmiş
        type: text

      - name: paragraf2
        label: Çalıştığım Yaş Grupları
        type: text

      - name: paragraf3
        label: Terapi Yaklaşımları
        type: text

      - name: paragraf4
        label: Yüz Yüze ve Online Terapi
        type: text

      - name: egitimBasligi
        label: Eğitim Bölümü Başlığı
        type: string


        
