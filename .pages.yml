
media:
  input: public/uploads
  output: /uploads
  rename: safe

content:
  - name: calisma_alanlari
    label: Çalışma Alanları
    type: collection
    path: src/data/calisma-alanlari
    format: json
    filename: "{primary}.json"
    view:
      primary: baslik
      fields: [baslik, sira, yayinda]
      sort: [sira]
      default:
        sort: sira
        order: asc
    fields:
      - name: baslik
        label: Çalışma Alanı Başlığı
        type: string
        required: true
      - name: aciklama
        label: Açıklama
        type: text
        required: true
      - name: sira
        label: Görünüm Sırası
        type: number
        default: 10
      - name: yayinda
        label: Sitede Göster
        type: boolean
        default: true

  - name: sertifikalar
    label: Sertifikalar
    type: collection
    path: src/data/sertifikalar
    format: json
    filename: "{primary}.json"
    fields:
      - name: ad
        label: Sertifika Adı
        type: string
        required: true
      - name: kurum
        label: Eğitimi Veren Kurum
        type: string
      - name: yil
        label: Eğitim Yılı
        type: string
      - name: sure
        label: Eğitim Süresi
        type: string
      - name: aciklama
        label: Açıklama
        type: text
      - name: gorsel
        label: Sertifika Görseli
        type: image
      - name: belge
        label: PDF Belgesi
        type: file
        options:
          categories: [document]
    view:
      primary: ad
      fields: [ad, kurum, yil]

  - name: gorusme_metinleri
    label: Görüşme Metinleri
    type: file
    path: src/data/gorusmeler.json
    format: json
    fields:
      - name: genelAciklama
        label: Bölüm Açıklaması
        type: text
        required: true
      - name: yuzYuzeAciklama
        label: Yüz Yüze Terapi Açıklaması
        type: text
        required: true
      - name: onlineAciklama
        label: Online Terapi Açıklaması
        type: text
        required: true

  - name: anasayfa
    label: Ana Sayfa İçerikleri
    type: file
    path: src/data/anasayfa.json
    format: json
    fields:
      - name: anaBaslik
        label: Ana Başlık
        type: string
        required: true
      - name: anaAciklama
        label: Ana Açıklama
        type: text
      - name: hakkimdaBaslik
        label: Hakkımda Başlığı
        type: string
      - name: hakkimdaAciklama
        label: Hakkımda Açıklaması
        type: text
      - name: iletisimBaslik
        label: İletişim Başlığı
        type: string
      - name: iletisimAciklama
        label: İletişim Açıklaması
        type: text

  - name: hakkimda_icerikleri
    label: Hakkımda İçerikleri
    type: file
    path: src/data/hakkimda.json
    format: json
    operations:
      delete: false
    fields:
      - name: sayfaBasligi
        label: Sayfa Başlığı
        type: string
      - name: sayfaAciklamasi
        label: Sayfa Alt Açıklaması
        type: string
      - name: tanitimBasligi
        label: Tanıtım Başlığı
        type: string
      - name: paragraf1
        label: Akademik Özgeçmiş
        type: text
      - name: paragraf2
        label: Çalıştığım Yaş Grupları
        type: text
      - name: paragraf3
        label: Terapi Yaklaşımları
        type: text
      - name: paragraf4
        label: Yüz Yüze ve Online Terapi
        type: text
      - name: egitimBasligi
        label: Eğitim Bölümü Başlığı
        type: string

  - name: iletisim_bilgileri
    label: İletişim Bilgileri
    type: file
    path: src/data/iletisim.json
    format: json
    operations:
      delete: false
    fields:
      - name: telefon
        label: Telefon (Uluslararası)
        type: string
        required: true
      - name: telefonGorunen
        label: Görünen Telefon Numarası
        type: string
        required: true
      - name: whatsapp
        label: WhatsApp Numarası
        type: string
        required: true
      - name: email
        label: E-posta Adresi
        type: string
        required: true
      - name: adres
        label: Ofis Adresi
        type: text
      - name: haritaLinki
        label: Google Maps Bağlantısı
        type: string
      - name: sayfaBasligi
        label: Sayfa Başlığı
        type: string
      - name: sayfaAciklamasi
        label: Sayfa Açıklaması
        type: text

  - name: egitim_icerikleri
    label: Mesleki Eğitimler ve Seminerler
    type: file
    path: src/data/egitim-icerikleri.json
    format: json
    operations:
      delete: false
    fields:
      - name: akademikEgitimler
        label: Akademik Eğitimler
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{baslik}"
        fields:
          - name: baslik
            label: Eğitim Derecesi
            type: string
            required: true
          - name: kurum
            label: Üniversite
            type: string
            required: true
          - name: aciklama
            label: Açıklama
            type: text
      - name: meslekiEgitimler
        label: Mesleki Eğitimler
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{ad}"
        fields:
          - name: ad
            label: Eğitim Adı
            type: string
            required: true
          - name: veren
            label: Eğitimi Veren Kişi / Kurum
            type: string
      - name: seminerler
        label: Eğitim ve Seminerler
        type: string
        list: true

  - name: seo_ayarlari
    label: SEO Ayarları
    type: file
    path: src/data/seo.json
    format: json
    fields:
      - name: anasayfa
        label: Ana Sayfa
        type: object
        fields:
          - name: title
            label: Google Başlığı
            type: string
          - name: description
            label: Google Açıklaması
            type: text
      - name: hakkimda
        label: Hakkımda
        type: object
        fields:
          - name: title
            label: Google Başlığı
            type: string
          - name: description
            label: Google Açıklaması
            type: text
      - name: calismaAlanlari
        label: Çalışma Alanları
        type: object
        fields:
          - name: title
            label: Google Başlığı
            type: string
          - name: description
            label: Google Açıklaması
            type: text
      - name: egitimler
        label: Eğitimler ve Sertifikalar
        type: object
        fields:
          - name: title
            label: Google Başlığı
            type: string
          - name: description
            label: Google Açıklaması
            type: text
      - name: iletisim
        label: İletişim
        type: object
        fields:
          - name: title
            label: Google Başlığı
            type: string
          - name: description
            label: Google Açıklaması
            type: text

  - name: site_gorselleri
    label: Site Görselleri
    type: file
    path: src/data/gorseller.json
    format: json
    operations:
      delete: false
    fields:
      - name: anaSayfaFotografi
        label: Ana Sayfa Fotoğrafı
        type: image
        options:
          extensions: [jpg, jpeg, png, webp]
      - name: anaSayfaAlt
        label: Ana Sayfa Fotoğraf Açıklaması
        type: string
      - name: hakkimdaFotografi
        label: Hakkımda Fotoğrafı
        type: image
        options:
          extensions: [jpg, jpeg, png, webp]
      - name: hakkimdaAlt
        label: Hakkımda Fotoğraf Açıklaması
        type: string
      - name: ofisFotografi
        label: Görüşme Odası Fotoğrafı
        type: image
        options:
          extensions: [jpg, jpeg, png, webp]
      - name: ofisAlt
        label: Görüşme Odası Fotoğraf Açıklaması
        type: string

  - name: site_bilgileri
    label: Site Alt Bilgileri
    type: file
    path: src/data/site-bilgileri.json
    format: json
    fields:
      - name: instagram
        label: Instagram Bağlantısı
        type: string
      - name: doktorsitesi
        label: DoktorSitesi Bağlantısı
        type: string
      - name: sonGuncelleme
        label: Son İçerik Güncelleme Tarihi
        type: string
      - name: editorEposta
        label: Site Editörü İletişim E-postası
        type: string

  - name: sss
    label: Sık Sorulan Sorular
    type: file
    path: src/data/sss.json
    format: json
    operations:
      delete: false
    fields:
      - name: baslik
        label: Bölüm Başlığı
        type: string
      - name: sorular
        label: Sorular
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{soru}"
        fields:
          - name: soru
            label: Soru
            type: string
            required: true
          - name: cevap
            label: Cevap
            type: text
            required: true
